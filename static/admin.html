<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TZ admin</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--accent:#1e2a5e;--warn:#92400e;--warnbg:#fffbeb;--ok:#166534;--okbg:#f0fdf4;--bad:#991b1b;--badbg:#fef2f2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e5e9f5;--mute:#94a3b8;--line:#263050;--accent:#8ea2ff;--warn:#fcd34d;--warnbg:#2a2310;--ok:#86efac;--okbg:#10231a;--bad:#fca5a5;--badbg:#2a1414}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar label{display:flex;gap:5px;align-items:center;color:var(--mute)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--warn);background:var(--warnbg)}.pill.bad{color:var(--bad);background:var(--badbg)}
.mute{color:var(--mute)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.msg{padding:7px 10px;border-radius:8px;margin:5px 0;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--bg)}.msg.user{background:var(--okbg);margin-left:auto}
ul.open{background:var(--warnbg);border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 28px;margin:0}
.login{max-width:360px;margin:12vh auto}.login input{width:100%;margin:8px 0}
.err{color:var(--bad);min-height:1.3em}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;overflow:auto;padding:20px;z-index:10}
#detail .panel{background:var(--bg);max-width:900px;margin:0 auto;border-radius:12px;padding:16px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media (max-width:640px){main{padding:10px}th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="detail"><div class="panel" id="panel"></div></div>
<script src="/static/admin.js"></script>
</body>
</html>
