# Sual bankı (müştəri dilində). Kodsuz redaktə olunur.
# Mətnlər {az, en, ru} formasındadır (en/ru boş qalsa AZ göstərilir). Ədədi/neytral mətnlər (məs. 'AZ + EN') düz yazılır.
# type: choice | text | email | languages
# options[].kw  — açar sözlər: LLM-siz sürətli uyğunlaşdırma üçün (üç dilin sözləri bir siyahıda)
# when.module   — yalnız həmin modul strukturda varsa soruşulur
# ask: false    — soruşulmur, şablon dəyəri ilə avtomatik doldurulur
# default       — YALNIZ ask:false (sabit standart) sahələr və 'Nümunə yoxdur' kimi faktiki cavab üçün. Asılan sahələrdə təxmin YOXDUR.
# skippable     — false olarsa 'developer ilə dəqiqləşdirəcəm' seçimi göstərilmir (sayt növü, ad, məqsəd məcburidir)
# skip_chip_label — sahəyə xas 'sonra göndərəcəm' düyməsi (məs. loqo)
# when.field/in — başqa sahənin cavabı həmin dəyərlərdən biridirsə soruşulur
# flow-dakı 'page_content' sahə deyil, xüsusi slotdur: struktur təsdiqlənəndən sonra hər səhifə üçün məzmun soruşulur (page_content_question)

skip_chip: {az: 'Developer ilə dəqiqləşdirəcəm', en: 'I will clarify with the developer', ru: 'Уточню с разработчиком'}
custom_default_chip: {az: 'Bilmirəm, developer qiymətləndirsin', en: 'I don''t know, let the developer estimate', ru: 'Не знаю, пусть оценит разработчик'}
flow: [site_type, company_name, purpose, audience, existing_site, existing_site_url, structure, page_content, languages, manage_mode, domain_hosting, domain_name, seo_analytics, design_style, brand_assets, brand_logo, brand_colors, reference_sites, reference_screenshots, competitors, contact_details, social_links, map_location, contact_email, payment_provider, account_details, cv_details, deadline, approver, revision_rounds, materials, budget_range]
structure_question:
  chip_ok: {az: Struktur uyğundur, en: Structure looks good, ru: Структура подходит}
  text: {az: 'Siz **{site_type}** seçdiniz. Bu növ sayt üçün aşağıdakı strukturu təklif edirəm. Çıxarmaq, əlavə etmək və ya dəyişmək istədiyiniz nə var? Cavabı yazın və ya kartdakı düymələrdən istifadə edin. Hər şey uyğundursa, "Struktur uyğundur" yazın.', en: 'You chose **{site_type}**. I suggest the structure below for this kind of site. What would you like to remove, add or change? Write it in the chat or use the buttons on the card. If everything fits, write "Structure looks good".', ru: 'Вы выбрали **{site_type}**. Для такого сайта я предлагаю структуру ниже. Что вы хотите убрать, добавить или изменить? Напишите в чате или используйте кнопки на карточке. Если всё подходит, напишите «Структура подходит».'}
  why: {az: 'Struktur saytın əsas planıdır: səhifələr və modullar həm görünüşü, həm də qiyməti müəyyən edir.', en: 'The structure is the main plan of the site: pages and modules decide both its look and its price.', ru: 'Структура это основной план сайта: страницы и модули определяют и внешний вид, и стоимость.'}
page_content_question:
  why: {az: 'Məzmun hazır olmayanda sayt gecikir; kimin nəyi hazırlayacağını əvvəlcədən bilmək qrafiki dəqiqləşdirir.', en: 'Sites are delayed when content is not ready; knowing who prepares what makes the schedule realistic.', ru: 'Сайты задерживаются, когда контент не готов; знание о том, кто что готовит, делает график реалистичным.'}
  text: {az: 'Səhifə: **{name}**. Orada hansı məzmun olacaq? Məsələn: mətnlər, şəkillər, məhsullar, sənədlər və onları kim hazırlayacaq.', en: 'Page: **{name}**. What content will go on it? For example: texts, images, products, documents and who will prepare them.', ru: 'Страница: **{name}**. Какой контент на ней будет? Например: тексты, изображения, товары, документы и кто их подготовит.'}
  all_later_chip: {az: Bütün səhifələrin məzmununu sonra göndərəcəm, en: I will send the content for all pages later, ru: Контент всех страниц отправлю позже}
custom_why: {az: 'Bu funksiya hazır kataloqda yoxdur, ona görə developer onu düzgün qiymətləndirmək üçün bu detalları bilməlidir.', en: 'This feature is not in our ready catalog, so the developer needs these details to estimate it properly.', ru: 'Этой функции нет в нашем готовом каталоге, поэтому разработчику нужны эти детали для правильной оценки.'}
custom_questions:
  who_uses: {az: 'Bu funksiyadan kimlər istifadə edəcək (müştərilər, işçilər, idarəçilər)?', en: 'Who will use this feature (customers, employees, administrators)?', ru: 'Кто будет пользоваться этой функцией (клиенты, сотрудники, администраторы)?'}
  data_input: {az: 'Bu funksiyada hansı məlumatlar daxil ediləcək və ya göstəriləcək?', en: 'What data will be entered or shown in this feature?', ru: 'Какие данные будут вводиться или отображаться в этой функции?'}
  outcome: {az: 'İstifadəçi bu funksiya ilə nəyə nail olmalıdır (gözlənilən nəticə)?', en: 'What should the user be able to achieve with this feature (expected result)?', ru: 'Чего пользователь должен достичь с помощью этой функции (ожидаемый результат)?'}
  integrations: {az: 'Bu funksiya başqa sistemlə (1C, CRM, bank, API və s.) əlaqəli olmalıdırmı?', en: 'Should this feature connect to another system (1C, CRM, bank, API, etc.)?', ru: 'Должна ли эта функция быть связана с другой системой (1С, CRM, банк, API и т. д.)?'}
fields:
  site_type:
    section: 1
    skippable: false
    label: {az: Sayt növü, en: Site type, ru: Тип сайта}
    type: choice
    required: true
    question: {az: 'Hazırlamaq istədiyiniz saytın növü hansıdır?', en: 'What type of website do you want to build?', ru: 'Какой тип сайта вы хотите создать?'}
    why: {az: 'Sayt növü hansı səhifələrin və funksiyaların lazım olacağını müəyyən edir.', en: 'The site type decides which pages and features you will need.', ru: 'Тип сайта определяет, какие страницы и функции вам понадобятся.'}
    options:
    - label: {az: Korporativ sayt, en: Corporate website, ru: Корпоративный сайт}
      value: corporate
      kw: [korporativ, şirkət, firma, corporate, company, корпоратив, компания, фирма]
    - label: {az: Onlayn mağaza, en: Online store, ru: Интернет-магазин}
      value: ecommerce
      kw: [mağaza, e-ticarət, eticaret, satış, shop, store, ecommerce, e-commerce, online store, магазин, интернет-магазин, продаж]
    - label: {az: Portfolio, en: Portfolio, ru: Портфолио}
      value: portfolio
      kw: [portfolio, şəxsi, işlərim, personal, портфолио, личный]
    - label: {az: Landing page, en: Landing page, ru: Лендинг}
      value: landing
      kw: [landing, tək səhifə, bir səhifə, one page, single page, лендинг, одностраничн]
    - label: {az: Rezervasiya / xidmət saytı, en: Booking / service website, ru: Сайт услуг / бронирования}
      value: booking
      kw: [rezervasiya, randevu, booking, reservation, appointment, бронирован, резервац, запись]
    - label: {az: Xəbər saytı, en: News website, ru: Новостной сайт}
      value: news
      kw: [xəbər, xeber, news, qəzet, media, jurnalistika, новост, сми, газета]
    - label: {az: Məktəb / təhsil saytı, en: School / education website, ru: Сайт школы / образования}
      value: school
      kw: [məktəb, mekteb, təhsil, tehsil, universitet, school, education, university, college, школа, образован, университет]
    - label: {az: Kataloq / directory, en: Directory / listings, ru: Каталог / справочник}
      value: directory
      kw: [directory, kataloq, siyahı, elan, listings, catalog of companies, справочник, каталог компаний, объявлен]
    - label: {az: Başqa növ, en: Other type, ru: Другой тип}
      value: other
      kw: [başqa, digər, other, another, different, другой, иной, друг]
  company_name:
    section: 1
    skippable: false
    label: {az: Layihə / şirkət adı, en: Project / company name, ru: Название проекта / компании}
    type: text
    required: true
    question: {az: 'Şirkətinizin (və ya saytınızın) adı nədir?', en: 'What is the name of your company (or website)?', ru: 'Как называется ваша компания (или сайт)?'}
    why: {az: 'Ad başlıqlarda, sənəddə və saytın məzmununda istifadə olunacaq.', en: 'The name is used in headings, in the document and in the site content.', ru: 'Название используется в заголовках, в документе и в содержимом сайта.'}
  purpose:
    section: 1
    skippable: false
    label: {az: Saytın məqsədi, en: Purpose of the website, ru: Цель сайта}
    type: text
    required: true
    question: {az: 'Saytın əsas məqsədi nədir? Məsələn: xidmətləri tanıtmaq, məhsul satmaq, müraciət toplamaq.', en: 'What is the main purpose of the site? For example: promote services, sell products, collect inquiries.', ru: 'Какова основная цель сайта? Например: рассказать об услугах, продавать товары, собирать обращения.'}
    why: {az: 'Məqsəd bizə saytın əsas səhifələrini və düymələrini düzgün planlamağa kömək edir.', en: 'The purpose helps us plan the main pages and buttons correctly.', ru: 'Цель помогает правильно спланировать основные страницы и кнопки.'}
  audience:
    section: 1
    label: {az: Hədəf auditoriya, en: Target audience, ru: Целевая аудитория}
    type: choice
    required: true
    question: {az: 'Saytı əsasən kimlər istifadə edəcək?', en: 'Who will mainly use the site?', ru: 'Кто в основном будет пользоваться сайтом?'}
    why: {az: 'Auditoriya dil, dizayn və məzmunun tonunu müəyyən edir.', en: 'The audience shapes the language, design and tone of the content.', ru: 'Аудитория определяет язык, дизайн и тон контента.'}
    options:
    - label: {az: Fiziki şəxslər (B2C), en: Individuals (B2C), ru: Физические лица (B2C)}
      value: b2c
      kw: [fiziki, b2c, istehlakçı, adi insan, individual, individuals, consumer, customers, person, физич, частн, потребител]
    - label: {az: Şirkətlər (B2B), en: Companies (B2B), ru: Компании (B2B)}
      value: b2b
      kw: [şirkət, b2b, biznes, companies, business, компан, бизнес]
    - label: {az: Hər ikisi, en: Both, ru: И те и другие}
      value: both
      kw: [hər ikisi, her ikisi, hamı, both, all, оба, обе, все, и те и друг]
    allow_other: true
  existing_site:
    section: 1
    label: {az: Saytın vəziyyəti, en: Website status, ru: Состояние сайта}
    type: choice
    required: false
    question: {az: 'Bu, sıfırdan yeni sayt olacaq, yoxsa mövcud saytın yenidən hazırlanması (redesign)?', en: 'Will this be a brand-new website, or a redesign of an existing one?', ru: 'Это будет новый сайт с нуля или редизайн существующего?'}
    why: {az: 'Köhnə sayt varsa, məzmunu və linkləri itirməməyimiz üçün bunu bilməliyik.', en: 'If an old site exists, we must know it so we do not lose its content and links.', ru: 'Если старый сайт есть, нам нужно знать об этом, чтобы не потерять контент и ссылки.'}
    options:
    - label: {az: Yeni sayt (sıfırdan), en: New website (from scratch), ru: Новый сайт (с нуля)}
      value: new
      kw: [sıfırdan, yeni sayt, from scratch, new site, new website, brand new, с нуля, новый сайт, новый]
    - label: {az: Mövcud saytın yenidən hazırlanması, en: Redesign of an existing website, ru: Редизайн существующего сайта}
      value: redesign
      kw: [redesign, yenidən, mövcud, köhnə sayt, existing, old site, revamp, rebuild, редизайн, переделк, существующ, старый сайт]
  existing_site_url:
    section: 1
    label: {az: Mövcud saytın linki, en: Link to the existing website, ru: Ссылка на существующий сайт}
    type: text
    required: false
    when: {field: existing_site, in: [redesign]}
    question: {az: 'Mövcud saytın linkini yazın (məs. https://company.az).', en: 'Please write the link to your existing website (e.g. https://company.com).', ru: 'Напишите ссылку на существующий сайт (напр. https://company.com).'}
    why: {az: 'Link bizə köhnə saytın məzmununa və strukturuna baxmağa imkan verir.', en: 'The link lets us look at the content and structure of the old site.', ru: 'Ссылка позволяет нам посмотреть контент и структуру старого сайта.'}
  languages:
    section: 2
    label: {az: Sayt dilləri, en: Website languages, ru: Языки сайта}
    type: languages
    required: true
    question: {az: 'Sayt hansı dillərdə olmalıdır? Əksər şirkətlər AZ + EN seçir.', en: 'Which languages should the site be in? Most companies choose AZ + EN.', ru: 'На каких языках должен быть сайт? Большинство компаний выбирают AZ + EN.'}
    why: {az: 'Hər əlavə dil səhifələrin tərcüməsi və dil menyusu deməkdir, bu da vaxta və büdcəyə təsir edir.', en: 'Every extra language means translated pages and a language menu, which affects time and budget.', ru: 'Каждый дополнительный язык означает переводы страниц и меню языков, это влияет на сроки и бюджет.'}
    options:
    - label: AZ
      value: [az]
    - label: AZ + EN
      value: [az, en]
    - label: AZ + EN + RU
      value: [az, en, ru]
    allow_other: true
  manage_mode:
    section: 2
    label: {az: Məzmunun idarə olunması, en: Content management, ru: Управление контентом}
    type: choice
    required: true
    question: {az: 'Saytın məzmununu sonradan özünüz idarə edəcəksiniz, yoxsa developer?', en: 'Will you manage the site content yourself later, or will the developer?', ru: 'Вы будете сами управлять содержимым сайта или разработчик?'}
    why: {az: 'Özünüz idarə edəcəksinizsə, saytda sadə admin panel hazırlanacaq.', en: 'If you manage the site yourself, we will build a simple admin panel for it.', ru: 'Если вы будете управлять сайтом сами, мы сделаем для него простую админ-панель.'}
    options:
    - label: {az: Özüm idarə edəcəm, en: I will manage it myself, ru: Буду управлять сам(а)}
      value: self
      kw: [özüm, özümüz, ozum, mən, myself, i will, сам, самост]
    - label: {az: Developer idarə etsin, en: The developer manages it, ru: Пусть управляет разработчик}
      value: dev
      kw: [developer, siz, proqramçı, programmer, разработчик, вы, программист]
  domain_hosting:
    section: 5
    label: {az: Domen və hostinq, en: Domain and hosting, ru: Домен и хостинг}
    type: choice
    required: false
    question: {az: 'Domen (məs. company.az) və hostinqiniz artıq varmı?', en: 'Do you already have a domain (e.g. company.com) and hosting?', ru: 'Есть ли у вас уже домен (напр. company.com) и хостинг?'}
    why: {az: 'Domen və hostinq texniki quraşdırmanı və yayımlanma planını müəyyən edir.', en: 'The domain and hosting define the technical setup and the launch plan.', ru: 'Домен и хостинг определяют техническую настройку и план запуска.'}
    options:
    - label: {az: Domen və hostinq var, en: I have both a domain and hosting, ru: Есть и домен и хостинг}
      value: both
      kw: [hər ikisi, her ikisi, domen və hostinq, both, domain and hosting, оба, и домен и хостинг]
    - label: {az: Yalnız domen var, en: Domain only, ru: Есть только домен}
      value: domain
      kw: [yalnız domen, yalniz domen, only domain, domain only, только домен]
    - label: {az: Yalnız hostinq var, en: Hosting only, ru: Есть только хостинг}
      value: hosting
      kw: [yalnız hostinq, yalniz hostinq, only hosting, hosting only, только хостинг]
    - label: {az: Heç biri yoxdur, en: Neither, ru: Нет ни того ни другого}
      value: none
      kw: [yoxdur, heç biri, neither, none, no domain, нет, ничего]
  domain_name:
    section: 5
    label: {az: Domen adı, en: Domain name, ru: Доменное имя}
    type: text
    required: false
    when: {field: domain_hosting, in: [both, domain]}
    question: {az: 'Domen adınız nədir? (məs. company.az)', en: 'What is your domain name? (e.g. company.com)', ru: 'Какое у вас доменное имя? (напр. company.com)'}
    why: {az: 'Domen adı saytın ünvanıdır; onu texniki bölməyə dəqiq yazırıq.', en: 'The domain name is the address of your site; we write it exactly in the technical section.', ru: 'Доменное имя это адрес вашего сайта; мы точно впишем его в технический раздел.'}
  seo_analytics:
    section: 5
    label: {az: SEO və analitika, en: SEO and analytics, ru: SEO и аналитика}
    type: choice
    required: false
    question: {az: 'Ziyarətçi statistikası və axtarışda görünmə üçün hansı Google alətləri qoşulsun?', en: 'Which Google tools should be connected for visitor statistics and search visibility?', ru: 'Какие инструменты Google подключить для статистики посетителей и видимости в поиске?'}
    why: {az: 'Bu alətlər sayta neçə nəfərin gəldiyini və axtarışda necə göründüyünü göstərir.', en: 'These tools show how many people visit the site and how it appears in search.', ru: 'Эти инструменты показывают, сколько людей посещают сайт и как он выглядит в поиске.'}
    options:
    - label: Google Analytics + Search Console
      value: both
      kw: [analytics və search, hər ikisi, her ikisi, both, оба, обе]
    - label: {az: Yalnız Google Analytics, en: Google Analytics only, ru: Только Google Analytics}
      value: ga
      kw: [analytics, analitika, аналитик]
    - label: {az: Yalnız Search Console, en: Search Console only, ru: Только Search Console}
      value: gsc
      kw: [search console, konsol, вебмастер]
    - label: {az: Lazım deyil, en: Not needed, ru: Не нужно}
      value: none
      kw: [lazım deyil, lazim deyil, not needed, no need, none, не нужно, не нужен]
    allow_other: true
  devices:
    section: 2
    label: {az: Cihaz uyğunluğu, en: Device compatibility, ru: Совместимость с устройствами}
    type: text
    required: false
    ask: false
    default: {az: 'Mobil, planşet və masaüstü (responsiv dizayn)', en: 'Mobile, tablet and desktop (responsive design)', ru: 'Мобильные, планшеты и ПК (адаптивный дизайн)'}
  design_style:
    section: 4
    label: {az: Dizayn üslubu, en: Design style, ru: Стиль дизайна}
    type: choice
    required: true
    question: {az: 'Saytın görünüşü necə olsun?', en: 'What should the site look like?', ru: 'Как должен выглядеть сайт?'}
    why: {az: 'Üslub dizayner üçün istiqamətdir: rənglər, şriftlər və ümumi görünüş buna əsasən seçilir.', en: 'The style is a direction for the designer: colors, fonts and the overall look follow from it.', ru: 'Стиль это ориентир для дизайнера: цвета, шрифты и общий вид выбираются по нему.'}
    options:
    - label: {az: Minimalist və korporativ, en: Minimalist and corporate, ru: Минималистичный и корпоративный}
      value: minimal
      kw: [minimalist, sadə, korporativ, təmiz, simple, clean, corporate, минимал, простой, строгий, корпоратив]
    - label: {az: Müasir və canlı, en: Modern and lively, ru: Современный и яркий}
      value: modern
      kw: [müasir, canlı, rəngli, yaradıcı, modern, lively, colorful, creative, современ, яркий, креатив]
    - label: {az: Lüks və premium, en: Luxury and premium, ru: Роскошный и премиальный}
      value: premium
      kw: [lüks, premium, elit, luxury, elite, люкс, премиум, элит, роскош]
    allow_other: true
  brand_assets:
    section: 4
    label: {az: Loqo və korporativ rənglər, en: Logo and brand colors, ru: Логотип и фирменные цвета}
    type: choice
    required: true
    question: {az: 'Loqonuz və korporativ rənginiz varmı?', en: 'Do you have a logo and brand colors?', ru: 'Есть ли у вас логотип и фирменные цвета?'}
    why: {az: 'Hazır loqo və rənglər varsa, dizayn onlara uyğun qurulur; yoxdursa, bunu ayrıca planlayırıq.', en: 'If you already have a logo and colors, the design is built around them; if not, we plan that separately.', ru: 'Если логотип и цвета уже есть, дизайн строится вокруг них; если нет, мы планируем это отдельно.'}
    options:
    - label: {az: Hər ikisi var, en: I have both, ru: Есть и то и другое}
      value: both
