  - name: {az: Case study, en: Case study, ru: Кейс}
    purpose: {az: Layihələrin ətraflı təsviri, en: Detailed description of projects, ru: Подробное описание проектов}
    modules: [case_study]
  - name: {az: Əlaqə, en: Contact, ru: Контакты}
    purpose: {az: Əməkdaşlıq üçün əlaqə, en: Contact for collaboration, ru: Контакты для сотрудничества}
    modules: [contact_form, social_links]
  global: []
  suggest: [blog, testimonials]
landing:
  title: {az: Landing page (tək səhifəli sayt), en: Landing page (single-page site), ru: Лендинг (одностраничный сайт)}
