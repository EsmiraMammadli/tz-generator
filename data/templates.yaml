# Başlanğıc şablonlar: sayt növünə görə təklif olunan səhifə strukturu.
# Modul id-ləri modules.yaml-dan götürülür. Mətnlər {az, en, ru} formasındadır.

corporate:
  title: {az: Korporativ sayt, en: Corporate website, ru: Корпоративный сайт}
  pages:
  - name: {az: Ana səhifə, en: Home page, ru: Главная страница}
    purpose: {az: Şirkətin qısa təqdimatı və əsas xidmətlər, en: A short introduction of the company and main services, ru: Краткое представление компании и основные услуги}
    modules: [banner, about_block, services_list, testimonials]
  - name: {az: Haqqımızda, en: About us, ru: О нас}
    purpose: {az: 'Şirkət, missiya və komanda haqqında', en: 'About the company, mission and team', ru: 'О компании, миссии и команде'}
    modules: [team]
  - name: {az: Xidmətlər, en: Services, ru: Услуги}
    purpose: {az: Xidmətlərin ətraflı təsviri, en: Detailed description of the services, ru: Подробное описание услуг}
    modules: [faq]
  - name: {az: Əlaqə, en: Contact, ru: Контакты}
    purpose: {az: Əlaqə məlumatları və müraciət forması, en: Contact details and inquiry form, ru: Контактные данные и форма обращения}
    modules: [contact_form, map, social_links]
  global: []
  suggest: [blog, career]
ecommerce:
  title: {az: Onlayn mağaza, en: Online store, ru: Интернет-магазин}
  pages:
  - name: {az: Ana səhifə, en: Home page, ru: Главная страница}
    purpose: {az: Kampaniyalar və seçilmiş məhsullar, en: Campaigns and featured products, ru: Акции и избранные товары}
    modules: [banner, testimonials]
  - name: {az: Məhsul kataloqu, en: Product catalog, ru: Каталог товаров}
    purpose: {az: Kateqoriya və filtr ilə məhsul siyahısı, en: Product list with categories and filters, ru: Список товаров с категориями и фильтрами}
    modules: [product_catalog]
  - name: {az: Məhsul səhifəsi, en: Product page, ru: Страница товара}
    purpose: {az: Tək məhsulun ətraflı təsviri, en: Detailed description of a single product, ru: Подробное описание отдельного товара}
    modules: [product_detail]
  - name: {az: Səbət və ödəniş, en: Cart and payment, ru: Корзина и оплата}
    purpose: {az: Sifarişin rəsmiləşdirilməsi, en: Placing the order, ru: Оформление заказа}
    modules: [cart, payment]
  - name: {az: Hesabım, en: My account, ru: Мой аккаунт}
    purpose: {az: Müştəri kabineti və sifariş tarixçəsi, en: Customer account and order history, ru: Личный кабинет клиента и история заказов}
    modules: [user_account]
  - name: {az: Əlaqə, en: Contact, ru: Контакты}
    purpose: {az: Əlaqə məlumatları və müraciət forması, en: Contact details and inquiry form, ru: Контактные данные и форма обращения}
    modules: [contact_form, map]
  global: [search]
  suggest: [blog, newsletter]
portfolio:
  title: {az: Portfolio sayt, en: Portfolio website, ru: Сайт-портфолио}
  pages:
  - name: {az: Ana səhifə, en: Home page, ru: Главная страница}
    purpose: {az: Qısa təqdimat və seçilmiş işlər, en: A short introduction and selected works, ru: Краткое представление и избранные работы}
    modules: [banner, about_block]
  - name: {az: İşlər, en: Works, ru: Работы}
    purpose: {az: Görülmüş işlərin nümayişi, en: Showcase of completed works, ru: Демонстрация выполненных работ}
