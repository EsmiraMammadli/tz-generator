# SEO/analitika sualına (seo_analytics) cavabdan asılı tələblər. 'default' yalnız sual hələ verilməyibsə göstərilir;
# müştəri 'Lazım deyil' deyibsə və ya cavabı açıq sual olaraq qalıbsa analitika tələbi TZ-yə yazılmır.
analytics_requirements:
  default:
  - {az: 'Analitika: Google Analytics, Yandex Metrica', en: 'Analytics: Google Analytics, Yandex Metrica', ru: 'Аналитика: Google Analytics, Яндекс Метрика'}
  both:
  - {az: 'Google Analytics qoşulması (ziyarətçi statistikası)', en: 'Google Analytics integration (visitor statistics)', ru: 'Подключение Google Analytics (статистика посетителей)'}
  - {az: 'Google Search Console qoşulması və sitemap.xml-in göndərilməsi', en: 'Google Search Console setup and sitemap.xml submission', ru: 'Подключение Google Search Console и отправка sitemap.xml'}
  ga:
  - {az: 'Google Analytics qoşulması (ziyarətçi statistikası)', en: 'Google Analytics integration (visitor statistics)', ru: 'Подключение Google Analytics (статистика посетителей)'}
  gsc:
  - {az: 'Google Search Console qoşulması və sitemap.xml-in göndərilməsi', en: 'Google Search Console setup and sitemap.xml submission', ru: 'Подключение Google Search Console и отправка sitemap.xml'}
  none: []
base_requirements:
  tech:
  - {az: SSL/HTTPS sertifikatı (məcburi), en: SSL/HTTPS certificate (mandatory), ru: SSL/HTTPS-сертификат (обязательно)}
  - {az: 'Verilənlər bazası: MariaDB/MySQL', en: 'Database: MariaDB/MySQL', ru: 'База данных: MariaDB/MySQL'}
  - {az: 'SEO: meta teqlər, açar sözlər, SEO dostu URL, sitemap.xml', en: 'SEO: meta tags, keywords, SEO-friendly URLs, sitemap.xml', ru: 'SEO: мета-теги, ключевые слова, SEO-friendly URL, sitemap.xml'}
  - {az: 'Hostinq: developer tövsiyəsinə uyğun (RAM və yaddaş layihə həcminə görə müəyyənləşir)', en: 'Hosting: as recommended by the developer (RAM and storage depend on project size)', ru: 'Хостинг: по рекомендации разработчика (ОЗУ и объём хранилища зависят от размера проекта)'}
  functional:
  - {az: Saytın məzmununun admin panel (CMS) vasitəsilə idarə olunması, en: Site content managed through an admin panel (CMS), ru: Управление контентом сайта через админ-панель (CMS)}
  - {az: Səhifənin yüklənmə sürəti ≤ 3 saniyə, en: Page load time ≤ 3 seconds, ru: Скорость загрузки страницы ≤ 3 секунд}
  security:
  - {az: SQL injection və XSS hücumlarından qorunma, en: Protection against SQL injection and XSS attacks, ru: Защита от SQL-инъекций и XSS-атак}
  - {az: İstifadəçi məlumatlarının şifrələnmiş saxlanması, en: Encrypted storage of user data, ru: Хранение пользовательских данных в зашифрованном виде}
  - {az: Gündəlik avtomatik ehtiyat nüsxə (backup), en: Daily automatic backup, ru: Ежедневное автоматическое резервное копирование}
