# Modul kataloqu. Kodsuz redaktə olunur: saat normaları, effektlər, açar sözlər.
# Mətnlər {az, en, ru} formasındadır. Yeni modul əlavə edəndə üç dili də yazın (en/ru boş qalsa AZ göstərilir).
# Saat normaları və tarif: öz agentliyinizin rəqəmləri ilə yoxlayın (saat, əlavə dil, quraşdırma).
# Aşağıdakı rəqəmlər Azərbaycan bazarı üçün başlanğıc orientirdir, nümunə deyil.

pricing:
  hourly_rate_azn: 40
  range_pct: 0.2
  hours_per_week: 40
  extra_language_hours_per_page: 1.5
  fixed:
  - id: setup
    label: {az: Quraşdırma və yerləşdirmə, en: Setup and deployment, ru: Настройка и развёртывание}
    hours: 14
  overhead:
  - id: design
    label: {az: UI/UX dizayn və prototip, en: UI/UX design and prototype, ru: UI/UX-дизайн и прототип}
    pct: 0.25
  - id: qa
    label: {az: Test və səhvlərin düzəldilməsi, en: Testing and bug fixing, ru: Тестирование и исправление ошибок}
    pct: 0.15
  - id: pm
    label: {az: Layihə idarəetməsi, en: Project management, ru: Управление проектом}
    pct: 0.1
  payment_plan:
  - label: {az: Avans (layihə başlayanda), en: Advance (at project start), ru: Аванс (при старте проекта)}
    pct: 30
  - label: {az: İlk demo təsdiqləndikdə, en: When the first demo is approved, ru: После утверждения первого демо}
    pct: 40
  - label: {az: Yekun təhvil, en: Final delivery, ru: Итоговая сдача}
    pct: 30
